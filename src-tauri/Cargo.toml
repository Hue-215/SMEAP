[package]
name = "astro-notepad"
version = "0.1.0"
edition = "2021"
license = "MIT"

# 本体はライブラリに置き、デスクトップの実行ファイル(`main.rs`)とAndroidのActivityの両方から
# 呼ぶ(`lib.rs`の`run`)。Androidは`cdylib`を読み込む。iOSは対象にしないので`staticlib`は足さない
[lib]
name = "astro_notepad_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
percent-encoding = "2"
# Androidで記事をzipにして書き出す(src/export.rs)。store.rsのテストでも使うので全ターゲットに置く
zip = { version = "8.6", default-features = false, features = ["chrono", "deflate-flate2-zlib-rs"] }

# 貼り付けた画像をクリップボードから読む(src/clipboard.rs)。TauriがLinuxで使っている版にそろえる
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# 保存画面を出し、選ばれた`content://`のURIへ書く(src/export.rs)。画面に権限は与えない
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 配布物の大きさを優先する。`panic = "abort"`は入れない(コマンド内のpanicでアプリ全体が落ちるため)
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
