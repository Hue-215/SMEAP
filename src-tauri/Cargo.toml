[package]
name = "smeap"
version = "0.1.0"
edition = "2021"
license = "MIT"

# 本体はライブラリに置き、デスクトップの実行ファイル(`main.rs`)とAndroidのActivityの両方から
# 呼ぶ(`lib.rs`の`run`)。Androidは`cdylib`を読み込む。iOSは対象にしないので`staticlib`は足さない
[lib]
name = "smeap_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
percent-encoding = "2"
# 記事をzipにする(src/store.rs)。書き出しはAndroidだけだが、store.rsはOSで分けないので全ターゲットに置く
zip = { version = "8.6", default-features = false, features = ["chrono", "deflate-flate2-zlib-rs"] }
# Androidの保存画面(src/export.rs)と、デスクトップの記事のディレクトリを選ぶ画面(src/settings.rs)
tauri-plugin-dialog = "2"

# GitHub連携(src/github/)。TLSはrustlsと、同梱のルート証明書(rustlsの既定のWebPki)を使い、native-tls・OpenSSLは使わない
ureq = "3"
# 宛先のURLを読んで確かめる(src/github/http.rs)。tauriが既に使っている版
url = "2"
# GitHubのページをブラウザで開く(src/github/commands.rs)。fsとdialogと同じくRust側からだけ使い、画面に権限は与えない
tauri-plugin-opener = "2"

# gitと同じblobのSHA-1(src/github/state.rs)
sha1 = "0.10"

# 通信の書き込みのblobの中身のbase64(src/github/git.rs)
base64 = "0.22"
# Commit & Pushのダイアログの、元にしたmdとの行単位の差分(src/github/push.rs)
similar = "2"

# GitHubのトークンをOSの資格情報の保存先に置く(src/github/token.rs)
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4"

# 貼り付けた画像をクリップボードから読む(src/clipboard.rs)。TauriがLinuxで使っている版にそろえる
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# 選ばれた`content://`のURIへ書く(src/export.rs)
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 配布物の大きさを優先する。`panic = "abort"`は入れない(コマンド内のpanicでアプリ全体が落ちるため)
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
