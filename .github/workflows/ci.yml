# 並行する2つのPRがそれぞれでは整合していても、合わせるとコンパイルできないことがある。
# 人の目では見つけにくいので、機械で毎回コンパイルする。
name: CI

on:
  pull_request:
  # PRのチェックはその時点のベースとの合流結果を見るので、ベースが後から進んで壊れた分は、
  # 合流を受けるブランチ(Git Flowで他から取り込む4種)で回して拾う。
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    # webkit2gtkのパッケージ名はUbuntuの版で変わったことがあるので、版を固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # デバッグビルドはdevUrlを読むので、画面のビルド成果物(dist/)は要らない
      - name: システム依存を入れる(Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: cargoのキャッシュ
        # 第三者のアクションなので、タグではなくコミットで固定する(タグは付け替えられる)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # PRで保存したキャッシュはほかのPRから使えず、容量の上限を埋めて合流先のキャッシュを追い出す
          save-if: ${{ github.event_name == 'push' }}

      - name: 書式
        run: cargo fmt --check

      # `--locked`: Cargo.lockの更新漏れを止める
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # Android向けにだけ外れるcfgは、ほかのジョブではコンパイルされない。APKは作らず(Gradleと署名の
  # 用意が要る)、コンパイルが通ることだけを確かめる
  rust-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Rustのターゲットを入れる
        run: rustup target add aarch64-linux-android

      - name: cargoのキャッシュ
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' }}

      - name: clippy(aarch64-linux-android)
        run: cargo clippy --target aarch64-linux-android --locked -- -D warnings

  # Gradleのwrapper(gradle-wrapper.jar)は、Androidのビルドで実行されるバイナリ。差し替えられて
  # いないかを、Gradleが公開するチェックサムと照合する
  gradle-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: lint
        run: npm run lint

      # 型検査(tsc -b)も含む
      - name: ビルド
        run: npm run build
