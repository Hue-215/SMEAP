# 並行する2つのPRがそれぞれでは整合していても、合わせるとコンパイルできないことがある。
# 人の目では見つけにくいので、機械で毎回コンパイルする。
name: CI

on:
  pull_request:
  # PRのチェックはその時点のベースとの合流結果を見るので、ベースが後から進んで壊れた分は、
  # 合流を受けるブランチ(Git Flowで他から取り込む4種)で回して拾う。
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    # webkit2gtkのパッケージ名はUbuntuの版で変わったことがあるので、版を固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # デバッグビルドはdevUrlを読むので、画面のビルド成果物(dist/)は要らない
      - name: システム依存を入れる(Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: cargoのキャッシュ
        # 第三者のアクションなので、タグではなくコミットで固定する(タグは付け替えられる)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: 書式
        run: cargo fmt --check

      # `--locked`: Cargo.lockの更新漏れを止める
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # Android向けにだけ外れるcfgは、ほかのジョブではコンパイルされない。APKは作らず(Gradleと署名の
  # 用意が要る)、コンパイルが通ることだけを確かめる。NDKはランナーの画像に入っているものを使う
  rust-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      # Gradleのwrapperは、Androidのビルドで実行されるバイナリ。差し替えられていないかを、
      # Gradleが版ごとに公開するチェックサムと照合する
      - name: Gradleのwrapperの照合
        working-directory: src-tauri/gen/android/gradle/wrapper
        run: |
          version=$(sed -n 's|^distributionUrl=.*/gradle-\(.*\)-bin\.zip$|\1|p' gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-wrapper.jar.sha256")
          echo "$expected  gradle-wrapper.jar" | sha256sum -c -

      - name: Rustのターゲットを入れる
        run: rustup target add aarch64-linux-android

      - name: cargoのキャッシュ
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: clippy(aarch64-linux-android)
        working-directory: src-tauri
        run: cargo clippy --target aarch64-linux-android --locked -- -D warnings

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: 型検査
        run: npm run typecheck

      - name: lint
        run: npm run lint

      # 型検査ではバンドルのときの失敗(importの解決・Viteの設定)を拾えない
      - name: ビルド
        run: npm run build
