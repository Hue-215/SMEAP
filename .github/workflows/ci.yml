# 並行する2つのPRがそれぞれでは整合していても、合わせるとコンパイルできないことがある。
name: CI

on:
  pull_request:
  # PRのチェックはその時点のベースとの合流結果を見るので、ベースが後から進んで壊れた分は、
  # ほかのブランチを取り込む先で回して拾う
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CIではデバッグ情報を使わない。キャッシュする`target`の大半を占める
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # `custom-protocol`のフィーチャを付けないビルドはdevUrlを読むので、画面のビルド成果物(dist/)は要らない
  rust:
    # webkit2gtkのパッケージ名はUbuntuの版で変わったことがあるので、版を固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: システム依存を入れる(Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: cargoのキャッシュ
        # 第三者のアクションなので、タグではなくコミットで固定する(タグは付け替えられる)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # PRで保存したキャッシュはほかのPRから使えず、容量の上限を埋めて合流先のキャッシュを追い出す
          save-if: ${{ github.event_name == 'push' }}

      - name: 書式
        run: cargo fmt --check

      # `--locked`: Cargo.lockの更新漏れを止める
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: テスト
        run: cargo test --lib --locked

  # 書式はOSで変わらないので、`rust`のジョブだけで見る
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: cargoのキャッシュ
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' }}

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: テスト
        run: cargo test --lib --locked

  # Android向けにだけ有効になるcfgは、ほかのジョブではコンパイルされない。APKは作らず(JDK・
  # Android SDK・NDKの用意が要る)、コンパイルが通ることだけを確かめる
  rust-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Rustのターゲットを入れる
        run: rustup target add aarch64-linux-android

      # GitHub連携のTLS(rustlsのring)にCのコードがあり、Android向けのCコンパイラが要る。ランナーに入っているNDKを使う
      - name: NDKのCコンパイラを指定する
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"

      - name: cargoのキャッシュ
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' }}

      - name: clippy(aarch64-linux-android)
        run: cargo clippy --target aarch64-linux-android --locked -- -D warnings

  # Gradleのwrapper(gradle-wrapper.jar)は、Androidのビルドで実行されるバイナリ。差し替えられて
  # いないかを、Gradleが公開するチェックサムと照合する
  gradle-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: lint
        run: npm run lint

      # 型検査(tsc -b)も含む
      - name: ビルド
        run: npm run build
