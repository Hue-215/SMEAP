<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Android 記事一覧</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Outlined';font-weight:300;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; background: {{t.scrim}}; color: {{t.fg}}; font-family: 'Noto Sans JP', sans-serif; overflow: hidden">
<aside style="width: 304px; flex-shrink: 0; display: flex; flex-direction: column; background: {{t.bg}}; border-right: 1px solid {{t.line}}">
<div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 20px; border-bottom: 1px solid {{t.line}}">
<span style="font-size: 14px; font-weight: 500">記事</span>
<button aria-label="新しい記事" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">add</span></button>
</div>
<nav aria-label="記事一覧" style="flex: 1; overflow-y: auto; padding: 8px 0">
<sc-for list="{{posts}}" as="p" hint-placeholder-count="4">
<a href="Android.dc.html" style="display: block; padding: 12px 20px 12px 17px; border-left: 3px solid {{p.mark}}; text-decoration: none; color: {{t.fg}}">
<div style="font-size: 15px; line-height: 1.5">{{p.title}}</div>
<div style="font-size: 12px; line-height: 1.5; color: {{t.gray}}">{{p.slug}} · {{p.date}}</div>
</a>
</sc-for>
</nav>
<div style="border-top: 1px solid {{t.line}}; padding: 4px 8px">
<button style="height: 48px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; color: {{t.gray}}"><span class="ms" aria-hidden="true">settings</span>設定</button>
</div>
</aside>
<a href="Android.dc.html" aria-label="記事一覧を閉じる" style="flex: 1"></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#000000', fg: '#FAFAFA', gray: '#8C8C8C', line: '#262626', scrim: '#1A1A1A', acc: '#F99D1D' }
      : { bg: '#FAFAFA', fg: '#000000', gray: '#707070', line: '#E0E0E0', scrim: '#BDBDBD', acc: '#D57C00' };
    const posts = [
      { title: 'はじめての記事', slug: 'first-post', date: '2026-10-22', on: true },
      { title: '画像の入れ方', slug: 'how-to-images', date: '2026-10-18' },
      { title: '下書き', slug: 'draft-0001', date: '2026-10-15' },
      { title: 'Astroのブログを始めた', slug: 'start-astro-blog', date: '2026-10-02' }
    ].map((p) => ({ ...p, mark: p.on ? t.acc : 'transparent' }));
    return { t, posts };
  }
}
</script>
</body>
</html>
