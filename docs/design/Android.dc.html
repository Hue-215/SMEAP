<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Android 編集画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;family=Noto+Serif+JP:wght@400&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Outlined';font-weight:300;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Noto Sans JP', sans-serif; overflow: hidden">
<div style="order: -2; height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px; border-bottom: 1px solid {{t.line}}">
<a href="AndroidDrawer.dc.html" aria-label="記事一覧を開く" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><span class="ms" aria-hidden="true">menu</span></a>
<span style="flex: 1; font-size: 12px; color: {{t.gray}}; padding-left: 4px">保存済み 14:32</span>
<button aria-label="リンク" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">link</span></button>
<button aria-label="画像を挿入" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">image</span></button>
<button aria-label="その他" aria-expanded="{{menuStr}}" onClick="{{toggleMenu}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">more_vert</span></button>
</div>

<sc-if value="{{menu}}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; top: 52px; right: 8px; width: 200px; background: {{t.bg}}; border: 1px solid {{t.line}}; z-index: 2; padding: 4px 0">
<button role="menuitem" style="width: 100%; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 14px"><span class="ms" aria-hidden="true" style="font-size: 20px">folder_zip</span>zipで書き出す</button>
<button role="menuitem" style="width: 100%; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 14px"><span class="ms" aria-hidden="true" style="font-size: 20px">settings</span>設定</button>
</div>
</sc-if>

<div style="order: 0; flex: 1; overflow-y: auto; padding: 24px 20px 32px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.4; font-weight: 500">はじめての記事</h1>
<p style="margin: 6px 0 0; font-family: 'Noto Serif JP', serif; font-size: 14px; line-height: 1.8; color: {{t.gray}}">Astro-Notepadで書いた最初の記事です。</p>
<div style="display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 16px; padding: 8px 0; border-top: 1px solid {{t.line}}; border-bottom: 1px solid {{t.line}}; font-size: 13px">
<label style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: {{t.gray}}">公開日
<input type="date" value="2026-10-22" style="border: 0; background: none; font-size: 13px; color: {{t.fg}}">
</label>
<button style="min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{t.gray}}"><span class="ms" aria-hidden="true" style="font-size: 18px">add_photo_alternate</span>ヒーロー画像</button>
</div>
<div style="margin-top: 24px; font-family: 'Noto Serif JP', serif; font-size: 16px; line-height: 1.9">
<p style="margin: 0; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; font-size: 20px; line-height: 1.6"><span style="color: {{t.gray}}">## </span>はじめに</p>
<p style="margin: 0">&#8203;</p>
<p style="margin: 0">この記事は<span style="color: {{t.gray}}">**</span><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 500">Astro-Notepad</span><span style="color: {{t.gray}}">**</span>で書いています。記号は消さずに残し、<span style="background: {{t.sel}}">見出しや太字にだけスタイルを付けます</span>。<span style="display: inline-block; width: 2px; height: 1.2em; vertical-align: text-bottom; background: {{t.acc}}"></span></p>
<p style="margin: 0">&#8203;</p>
<p style="margin: 0; color: {{t.gray}}; font-size: 13px; word-break: break-all">![](../../assets/first-post/01.png)</p>
<div role="img" aria-label="01.png の表示" style="margin-top: 8px; height: 200px; border: 1px solid {{t.line}}; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans JP', sans-serif; font-size: 13px; color: {{t.gray}}">[ 01.png の画像 ]</div>
</div>
</div>

<div aria-hidden="true" style="order: 100; height: 260px; border-top: 1px solid {{t.line}}; flex-shrink: 0; background: {{t.kb}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: {{t.gray}}">[ キーボード ]</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: false }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#000000', fg: '#FAFAFA', gray: '#8C8C8C', line: '#262626', kb: '#141414', acc: '#F99D1D', sel: '#3E2D16' }
      : { bg: '#FAFAFA', fg: '#000000', gray: '#707070', line: '#E0E0E0', kb: '#EDEDED', acc: '#D57C00', sel: '#F0DFC8' };
    return {
      t,
      menu: this.state.menu,
      menuStr: this.state.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !this.state.menu })
    };
  }
}
</script>
</body>
</html>
