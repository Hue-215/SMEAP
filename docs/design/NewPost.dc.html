<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>新しい記事</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 520px; height: 380px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{t.scrim}}; font-family: 'Noto Sans JP', sans-serif">
<div role="dialog" aria-labelledby="np-title" style="width: 440px; box-sizing: border-box; padding: 24px; background: {{t.bg}}; color: {{t.fg}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 16px">
<h2 id="np-title" style="margin: 0; font-size: 16px; font-weight: 500">新しい記事</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="slug" style="font-size: 13px">slug(記事のディレクトリ名・URL)</label>
<input id="slug" value="{{slug}}" aria-describedby="slug-hint" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid {{t.field}}; background: none; color: {{t.fg}}; font-size: 14px">
<p id="slug-hint" style="margin: 0; font-size: 12px; line-height: 1.6; color: {{hintColor}}">{{hint}}</p>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: {{t.gray}}">書き出し先: ./{{slug}}/src/content/posts/{{slug}}.md</p>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button style="height: 40px; padding: 0 16px; border: 1px solid {{t.line}}; background: none; color: {{t.fg}}; font-size: 14px">キャンセル</button>
<button style="height: 40px; padding: 0 16px; border: 0; background: {{t.fg}}; color: {{t.bg}}; font-size: 14px">作成</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"error":{"editor":"boolean","default":false},"$preview":{"width":520,"height":380}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const error = this.props.error ?? false;
    const t = dark
      ? { bg: '#000000', fg: '#FAFAFA', gray: '#8C8C8C', line: '#262626', field: '#5A5A5A', scrim: '#1A1A1A', err: '#F08A7E' }
      : { bg: '#FAFAFA', fg: '#000000', gray: '#707070', line: '#E0E0E0', field: '#8A8A8A', scrim: '#D9D9D9', err: '#B3261E' };
    return {
      t,
      slug: error ? 'First_Post' : 'first-post',
      hint: error ? '使えない文字があります。英小文字・数字・ハイフンだけにしてください' : '英小文字・数字・ハイフンが使えます。あとから変更もできます',
      hintColor: error ? t.err : t.gray
    };
  }
}
</script>
</body>
</html>
