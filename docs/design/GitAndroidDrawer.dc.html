<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GitHub Android 記事一覧</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Outlined';font-weight:300;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; background: {{t.scrim}}; color: {{t.fg}}; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; position: relative">
<aside style="width: 304px; flex-shrink: 0; display: flex; flex-direction: column; background: {{t.bg}}; border-right: 1px solid {{t.line}}">
<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px 0 20px; border-bottom: 1px solid {{t.line}}">
<span style="flex: 1; font-size: 14px; font-weight: 500">記事</span>
<button aria-label="GitHubから読み込む" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">sync</span></button>
<button aria-label="新しい記事" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">add</span></button>
</div>
<div role="status" style="padding: 10px 20px 0; font-size: 12px; line-height: 1.5; color: {{t.gray}}">niigo/blog · 14:30に読み込み</div>
<nav aria-label="記事一覧" style="flex: 1; overflow-y: auto; padding: 4px 0 8px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<h2 style="margin: 0; padding: 16px 20px 4px; font-size: 12px; font-weight: 500; color: {{t.gray}}">{{g.name}} {{g.count}}</h2>
<sc-for list="{{g.posts}}" as="p" hint-placeholder-count="2">
<a href="GitAndroid.dc.html" style="display: block; padding: 10px 20px 10px 17px; border-left: 3px solid {{p.mark}}; background: {{p.bg}}; color: {{t.fg}}">
<div style="display: flex; align-items: center; gap: 6px">
<span style="flex: 1; min-width: 0; font-size: 15px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.title}}</span>
<sc-if value="{{p.conflict}}" hint-placeholder-val="{{ false }}"><span class="ms" role="img" aria-label="GitHub上の内容と食い違っています" style="font-size: 20px; color: {{t.err}}">sync_problem</span></sc-if>
<sc-if value="{{p.dirty}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="commitしていない変更があります" style="width: 8px; height: 8px; border-radius: 50%; background: {{t.acc}}; flex-shrink: 0"></span></sc-if>
</div>
<div style="font-size: 12px; line-height: 1.5; color: {{t.gray}}">{{p.slug}} · {{p.date}}</div>
</a>
</sc-for>
</sc-for>
</nav>
<div style="border-top: 1px solid {{t.line}}; padding: 4px 8px">
<a href="GitSettings.dc.html" style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; color: {{t.gray}}"><span class="ms" aria-hidden="true">settings</span>設定</a>
</div>
</aside>
<a href="GitAndroid.dc.html" aria-label="記事一覧を閉じる" style="flex: 1"></a>

<sc-if value="{{showMenu}}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="{{menuTitle}}" style="position: absolute; left: 96px; top: {{menuTop}}; width: 200px; padding: 4px 0; background: {{t.bg}}; border: 1px solid {{t.line}}">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="2">
<button role="menuitem" style="width: 100%; height: 48px; display: flex; align-items: center; padding: 0 16px; font-size: 14px; text-align: left; color: {{m.color}}">{{m.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"menu":{"editor":"enum","options":["なし","執筆中の記事を長押し","編集中の記事を長押し","公開済みの記事を長押し"],"default":"なし"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const menuKind = this.props.menu ?? 'なし';
    const t = dark
      ? { bg: '#000000', fg: '#FAFAFA', gray: '#8C8C8C', line: '#262626', scrim: '#1A1A1A', acc: '#F99D1D', err: '#F08A7E', press: '#1F1F1F' }
      : { bg: '#FAFAFA', fg: '#000000', gray: '#707070', line: '#E0E0E0', scrim: '#BDBDBD', acc: '#D57C00', err: '#B3261E', press: '#EBEBEB' };
    const pressed = { '執筆中の記事を長押し': 'draft-0001', '編集中の記事を長押し': 'how-to-images', '公開済みの記事を長押し': 'start-astro-blog' }[menuKind];
    const data = [
      { name: '執筆中', posts: [
        { title: 'はじめての記事', slug: 'first-post', date: '2026-10-22', dirty: true, on: true },
        { title: '下書き', slug: 'draft-0001', date: '2026-10-15', dirty: true }
      ] },
      { name: '編集中', posts: [
        { title: '画像の入れ方', slug: 'how-to-images', date: '2026-10-18', dirty: true, conflict: true }
      ] },
      { name: '公開済み', posts: [
        { title: 'Astroのブログを始めた', slug: 'start-astro-blog', date: '2026-10-02' },
        { title: 'SMEAPを作った', slug: 'making-smeap', date: '2026-09-20' }
      ] }
    ];
    const groups = data.map((g) => ({
      name: g.name,
      count: g.posts.length,
      posts: g.posts.map((p) => ({
        ...p,
        dirty: !!p.dirty,
        conflict: !!p.conflict,
        mark: p.on ? t.acc : 'transparent',
        bg: p.slug === pressed ? t.press : 'transparent'
      }))
    }));
    const menus = {
      '執筆中の記事を長押し': { top: '250px', items: [['slugを変更', t.fg], ['記事を書き出す', t.fg], ['削除', t.err]] },
      '編集中の記事を長押し': { top: '340px', items: [['記事を書き出す', t.fg], ['編集をやめる', t.err]] },
      '公開済みの記事を長押し': { top: '430px', items: [['記事を書き出す', t.fg]] }
    };
    const m = menus[menuKind];
    return {
      t, groups,
      showMenu: !!m,
      menuTitle: '記事のメニュー',
      menuTop: m ? m.top : '0',
      menu: m ? m.items.map(([label, color]) => ({ label, color })) : []
    };
  }
}
</script>
</body>
</html>
