<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検索 Android</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;family=Noto+Serif+JP:wght@400&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Noto Sans JP', sans-serif; overflow: hidden">

<sc-if value="{{search}}" hint-placeholder-val="{{ true }}">
<div role="search" style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px; border-bottom: 1px solid {{t.line}}">
<button aria-label="検索を閉じる" onClick="{{closeSearch}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
<label style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; border: 1px solid {{t.field}}; outline: 2px solid {{t.acc}}; outline-offset: -2px">
<input aria-label="本文を検索" value="{{query}}" onChange="{{onQuery}}" style="flex: 1; min-width: 0; border: 0; background: none; font-size: 16px">
</label>
<span role="status" style="min-width: 48px; padding: 0 4px 0 8px; font-size: 12px; color: {{t.gray}}; text-align: center; white-space: nowrap">{{count}}</span>
<button aria-label="前を検索" onClick="{{prev}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">keyboard_arrow_up</span></button>
<button aria-label="次を検索" onClick="{{next}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">keyboard_arrow_down</span></button>
</div>
</sc-if>
<sc-if value="{{notSearch}}" hint-placeholder-val="{{ false }}">
<div role="toolbar" aria-label="編集" style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px; border-bottom: 1px solid {{t.line}}">
<button aria-label="記事一覧を開く" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">menu</span></button>
<span role="status" style="flex: 1; padding: 0 4px; font-size: 12px; color: {{t.gray}}">保存済み 14:32</span>
<button aria-label="リンクを挿入" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">link</span></button>
<button aria-label="画像を挿入" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">image</span></button>
<button aria-label="検索" onClick="{{openSearch}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">search</span></button>
</div>
</sc-if>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px 32px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.4; font-weight: 500">はじめての記事</h1>
<p style="margin: 6px 0 0; font-family: 'Noto Serif JP', serif; font-size: 14px; line-height: 1.8; color: {{t.gray}}">SMEAPで書いた最初の記事です。</p>
<div style="margin-top: 16px; padding: 12px 0; border-top: 1px solid {{t.line}}; border-bottom: 1px solid {{t.line}}; font-size: 13.6px; color: {{t.gray}}">公開日 <span style="color: {{t.fg}}; padding-left: 8px">2026/10/22</span></div>
<div style="margin-top: 24px; font-family: 'Noto Serif JP', serif; font-size: 16px; line-height: 1.9">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="10">
<p style="margin: 0; {{l.css}}"><sc-for list="{{l.segs}}" as="s" hint-placeholder-count="2"><span style="{{s.css}}">{{s.t}}</span></sc-for></p>
</sc-for>
</div>
</div>

<sc-if value="{{search}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="height: 260px; flex-shrink: 0; border-top: 1px solid {{t.line}}; background: {{t.kb}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: {{t.gray}}">[ キーボード ]</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { search: true, query: '記号', cur: 1 }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#000000', fg: '#FAFAFA', gray: '#808080', line: '#262626', field: '#5A5A5A', kb: '#141414', acc: '#FFA01A', sel: '#5A4228' }
      : { bg: '#FAFAFA', fg: '#0A1526', gray: '#5A6A80', line: '#E0E0E0', field: '#8A8A8A', kb: '#EDEDED', acc: '#FFA01A', sel: '#F3D9C2' };
    const sans = "font-family: 'Noto Sans JP', sans-serif; ";
    const base = { '': '', m: 'color: ' + t.gray, b: sans + 'font-weight: 500', u: 'text-decoration: underline' };
    const body = [
      { css: sans + 'font-weight: 500; font-size: 20px; line-height: 1.6', segs: [['## ', 'm'], ['はじめに', '']] },
      { segs: [] },
      { segs: [['この記事は', ''], ['**', 'm'], ['SMEAP', 'b'], ['**', 'm'], ['で書いています。記号は消さずに残し、見出しや太字にだけスタイルを付けます。', '']] },
      { segs: [] },
      { segs: [['- ', 'm'], ['箇条書きの記号もそのまま', '']] },
      { segs: [['- ', 'm'], ['[', 'm'], ['リンク', 'u'], ['](https://astro.build)', 'm'], ['は下線だけ付ける', '']] },
      { segs: [] },
      { segs: [['見出しの記号も、太字の記号も灰色で残ります。', '']] },
      { segs: [] },
      { segs: [['ここに本文が続きます。', '']] }
    ];
    const q = this.state.search ? this.state.query : '';
    let total = 0;
    const split = body.map((line) => {
      const out = [];
      for (const [text, kind] of line.segs) {
        if (!q) { out.push({ t: text, kind }); continue; }
        const parts = text.split(q);
        parts.forEach((p, i) => {
          if (p) out.push({ t: p, kind });
          if (i < parts.length - 1) out.push({ t: q, kind, hit: total++ });
        });
      }
      if (!out.length) out.push({ t: '​', kind: '' });
      return { css: line.css ?? '', segs: out };
    });
    const cur = total ? ((this.state.cur % total) + total) % total : -1;
    const lines = split.map((line) => ({
      css: line.css,
      segs: line.segs.map((s) => {
        let css = base[s.kind];
        if (s.hit !== undefined) {
          css += '; box-shadow: inset 0 -2px 0 ' + t.acc;
          if (s.hit === cur) css += '; background: ' + t.sel;
        }
        return { t: s.t, css };
      })
    }));
    const count = !q ? '' : total ? (cur + 1) + '/' + total : '0件';
    const step = (d) => () => this.setState({ cur: this.state.cur + d });
    return {
      t, lines, count,
      search: this.state.search,
      notSearch: !this.state.search,
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value, cur: 0 }),
      prev: step(-1),
      next: step(1),
      openSearch: () => this.setState({ search: true }),
      closeSearch: () => this.setState({ search: false })
    };
  }
}
</script>
</body>
</html>
