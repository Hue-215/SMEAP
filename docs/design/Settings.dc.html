<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>デスクトップ 設定画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;family=Noto+Serif+JP:wght@400&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Outlined';font-weight:300;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:#2F5E93}a:hover{color:#1F4470}
</style>
</helmet>
<div style="height: 800px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Noto Sans JP', sans-serif; overflow: hidden">
<div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid {{t.line}}">
<button aria-label="編集画面に戻る" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
<h1 style="margin: 0; font-size: 16px; font-weight: 500">設定</h1>
</div>
<div style="flex: 1; overflow-y: auto">
<div style="max-width: 720px; margin: 0 auto; padding: 40px 32px; box-sizing: border-box">
<h2 style="margin: 0 0 12px; font-size: 14px; font-weight: 500">ライセンス</h2>
<div style="border-top: 1px solid {{t.line}}; border-bottom: 1px solid {{t.line}}; padding: 16px 0">
<p style="margin: 0 0 4px; font-size: 14px; font-weight: 500">Astro-Notepad</p>
<p style="margin: 0 0 12px; font-size: 13px; color: {{t.gray}}">MIT License · Copyright (c) [年] [著作者名]</p>
<pre style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 13px; line-height: 1.8; white-space: pre-wrap; color: {{t.fg}}">Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, …</pre>
</div>
<h2 style="margin: 32px 0 12px; font-size: 14px; font-weight: 500">使っているもの</h2>
<sc-for list="{{deps}}" as="d" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid {{t.line}}; font-size: 14px">
<span>{{d.name}}</span>
<span style="color: {{t.gray}}">{{d.license}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#000000', fg: '#FAFAFA', gray: '#8C8C8C', line: '#262626' }
      : { bg: '#FAFAFA', fg: '#000000', gray: '#707070', line: '#E0E0E0' };
    return {
      t,
      deps: [
        { name: 'Tauri', license: 'MIT / Apache-2.0' },
        { name: 'React', license: 'MIT' },
        { name: 'CodeMirror', license: 'MIT' },
        { name: 'Noto Sans JP / Noto Serif JP', license: 'SIL Open Font License 1.1' },
        { name: 'Material Symbols', license: 'Apache-2.0' }
      ]
    };
  }
}
</script>
</body>
</html>
