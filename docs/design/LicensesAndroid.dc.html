<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Android オープンソースライセンス</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Outlined';font-weight:300;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input::placeholder{color:#8C8C8C}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Noto Sans JP', sans-serif; overflow: hidden">
<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1px solid {{t.line}}">
<button onClick="{{back}}" aria-label="戻る" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></button>
<h1 style="margin: 0; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{heading}}</h1>
</div>
<div style="flex: 1; overflow-y: auto">
<sc-if value="{{listing}}" hint-placeholder-val="{{true}}">
<div style="padding: 12px 16px 4px">
<label style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid {{t.field}}">
<span class="ms" aria-hidden="true" style="color: {{t.gray}}">search</span>
<input value="{{query}}" onChange="{{onQuery}}" placeholder="パッケージ名で絞り込む" aria-label="パッケージ名で絞り込む" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; color: {{t.fg}}; font: inherit; font-size: 15px">
</label>
<p style="margin: 8px 0 0; font-size: 13px; color: {{t.gray}}">{{countLabel}}</p>
</div>
<sc-for list="{{rows}}" as="p" hint-placeholder-count="10">
<button onClick="{{p.pick}}" style="width: 100%; box-sizing: border-box; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid {{t.line}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.name}}</span>
<span style="font-size: 13px; color: {{t.gray}}">{{p.license}}</span>
</span>
<span class="ms" aria-hidden="true" style="color: {{t.gray}}">chevron_right</span>
</button>
</sc-for>
</sc-if>
<sc-if value="{{detail}}" hint-placeholder-val="{{false}}">
<pre style="margin: 0; padding: 16px; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; color: {{t.fg}}">{{text}}</pre>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const MIT_BODY = 'Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.';
const TEXTS = {
  'MIT': (name) => 'MIT License\n\nCopyright (c) [' + name + 'の著作権者]\n\n' + MIT_BODY,
  'Apache-2.0': (name) => 'Apache License\nVersion 2.0, January 2004\nhttp://www.apache.org/licenses/\n\n[' + name + 'のNOTICEがあればここに入る]\n\nTERMS AND CONDITIONS FOR USE, REPRODUCTION, AND DISTRIBUTION\n\n[以下、全文]',
  'OFL-1.1': (name) => 'Copyright [年] The Noto Project Authors\n\nThis Font Software is licensed under the SIL Open Font License, Version 1.1.\n\nSIL OPEN FONT LICENSE Version 1.1 - 26 February 2007\n\n[以下、全文]'
};
const PACKAGES = [
  ['Astro-Notepad', 'MIT'],
  ['@codemirror/commands', 'MIT'],
  ['@codemirror/lang-markdown', 'MIT'],
  ['@codemirror/language', 'MIT'],
  ['@codemirror/state', 'MIT'],
  ['@codemirror/view', 'MIT'],
  ['@lezer/highlight', 'MIT'],
  ['@lezer/markdown', 'MIT'],
  ['@tauri-apps/api', 'Apache-2.0'],
  ['chrono', 'MIT'],
  ['gtk', 'MIT'],
  ['Material Symbols', 'Apache-2.0'],
  ['Noto Sans JP', 'OFL-1.1'],
  ['Noto Serif JP', 'OFL-1.1'],
  ['percent-encoding', 'MIT'],
  ['react', 'MIT'],
  ['react-dom', 'MIT'],
  ['serde', 'MIT'],
  ['serde_json', 'MIT'],
  ['tauri', 'Apache-2.0'],
  ['tempfile', 'MIT'],
  ['thiserror', 'MIT']
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '', open: null };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#000000', fg: '#FAFAFA', gray: '#8C8C8C', line: '#262626', field: '#5A5A5A' }
      : { bg: '#FAFAFA', fg: '#000000', gray: '#707070', line: '#E0E0E0', field: '#8A8A8A' };
    const q = this.state.query.trim().toLowerCase();
    const rows = PACKAGES
      .filter(([name]) => !q || name.toLowerCase().includes(q))
      .map(([name, license]) => ({ name, license, pick: () => this.setState({ open: name }) }));
    const current = PACKAGES.find(([name]) => name === this.state.open);
    return {
      t,
      rows,
      listing: !current,
      detail: !!current,
      heading: current ? current[0] : 'オープンソースライセンス',
      text: current ? TEXTS[current[1]](current[0]) : '',
      query: this.state.query,
      countLabel: q ? rows.length + '件' : '[件数]件',
      onQuery: (e) => this.setState({ query: e.target.value }),
      back: () => this.setState({ open: null })
    };
  }
}
</script>
</body>
</html>
