<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GitHub デスクトップ 編集画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&amp;family=Noto+Serif+JP:wght@400&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="height: 800px; display: flex; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Noto Sans JP', sans-serif; font-weight: 400; overflow: hidden">

<aside style="width: 264px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid {{t.line}}">
<div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 8px 0 20px; border-bottom: 1px solid {{t.line}}">
<span style="flex: 1; font-size: 13.6px; font-weight: 500">記事</span>
<button aria-label="GitHubから読み込む" title="GitHubから読み込む" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">sync</span></button>
<button aria-label="新しい記事" title="新しい記事" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">add</span></button>
</div>
<div role="status" style="display: flex; align-items: center; gap: 6px; padding: 10px 20px 0; font-size: 12px; line-height: 1.5; color: {{fetchColor}}">
<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}"><span class="ms" aria-hidden="true" style="font-size: 16px">cloud_off</span></sc-if>
<span>{{fetchText}}</span>
</div>
<nav aria-label="記事一覧" style="flex: 1; overflow-y: auto; padding: 4px 0 8px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<h2 style="margin: 0; padding: 16px 20px 4px; font-size: 12px; font-weight: 500; color: {{t.gray}}">{{g.name}} {{g.count}}</h2>
<sc-for list="{{g.posts}}" as="p" hint-placeholder-count="2">
<a href="#" onClick="{{p.pick}}" style="display: block; padding: 8px 20px 8px 17px; border-left: 3px solid {{p.mark}}; color: {{t.fg}}">
<div style="display: flex; align-items: center; gap: 6px">
<span style="flex: 1; min-width: 0; font-size: 13.6px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.title}}</span>
<sc-if value="{{p.conflict}}" hint-placeholder-val="{{ false }}"><span class="ms" role="img" aria-label="GitHub上の内容と食い違っています" title="GitHub上の内容と食い違っています" style="font-size: 18px; color: {{t.err}}">sync_problem</span></sc-if>
<sc-if value="{{p.dirty}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="commitしていない変更があります" title="commitしていない変更があります" style="width: 8px; height: 8px; border-radius: 50%; background: {{t.acc}}; flex-shrink: 0"></span></sc-if>
</div>
<div style="font-size: 12px; line-height: 1.5; color: {{t.gray}}">{{p.slug}} · {{p.date}}</div>
</a>
</sc-for>
</sc-for>
</nav>
<div style="border-top: 1px solid {{t.line}}; padding: 4px 8px">
<a href="GitSettings.dc.html" style="height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 13.6px; color: {{t.gray}}"><span class="ms" aria-hidden="true" style="font-size: 22px">settings</span>設定</a>
</div>
</aside>

<main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div role="toolbar" aria-label="編集" style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 12px; border-bottom: 1px solid {{t.line}}">
<button aria-label="記事一覧を閉じる" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">left_panel_close</span></button>
<sc-if value="{{canCommit}}" hint-placeholder-val="{{ true }}">
<a href="GitCommit.dc.html" aria-label="Commit &amp; Push" title="Commit &amp; Push" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; position: relative"><span class="ms" aria-hidden="true">upload</span><span aria-hidden="true" style="position: absolute; top: 6px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: {{t.acc}}"></span></a>
</sc-if>
<sc-if value="{{cannotCommit}}" hint-placeholder-val="{{ false }}">
<button disabled aria-label="Commit &amp; Push" title="commitしていない変更はありません" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: {{t.gray}}; cursor: default"><span class="ms" aria-hidden="true">upload</span></button>
</sc-if>
<span role="status" style="padding: 0 8px; font-size: 12px; color: {{t.gray}}">保存済み 14:32</span>
<span style="flex: 1"></span>
<button aria-label="リンクを挿入" title="リンクを挿入" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">link</span></button>
<button aria-label="画像を挿入" title="画像を挿入" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">image</span></button>
</div>

<div style="flex: 1; overflow-y: auto">
<div style="max-width: 720px; margin: 0 auto; padding: 48px 32px 96px; box-sizing: border-box">
<div style="display: flex; gap: 24px">
<div style="flex: 1; min-width: 0">
<h1 style="margin: 0; font-size: 32px; line-height: 1.4; font-weight: 500">{{cur.title}}</h1>
<p style="margin: 8px 0 0; font-family: 'Noto Serif JP', serif; font-size: 15px; line-height: 1.8; color: {{t.gray}}">SMEAPで書いた最初の記事です。</p>
</div>
<div style="width: 160px; height: 96px; flex-shrink: 0; border: 1px solid {{t.line}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: {{t.gray}}">サムネイル未設定</div>
</div>
<div style="margin-top: 20px; padding: 12px 0; border-top: 1px solid {{t.line}}; border-bottom: 1px solid {{t.line}}; font-size: 13.6px; color: {{t.gray}}">公開日 <span style="color: {{t.fg}}; padding-left: 8px">{{cur.date}}</span></div>
<div style="margin-top: 32px; font-family: 'Noto Serif JP', serif; font-size: 16px; line-height: 1.9">
<p style="margin: 0; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.6"><span style="color: {{t.gray}}">## </span>はじめに</p>
<p style="margin: 0">​</p>
<p style="margin: 0">この記事は<span style="color: {{t.gray}}">**</span><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 500">SMEAP</span><span style="color: {{t.gray}}">**</span>で書いています。</p>
<p style="margin: 0">​</p>
<p style="margin: 0">ここに本文が続きます。</p>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;offline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'first-post' }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const offline = this.props.offline ?? false;
    const t = dark
      ? { bg: '#000000', fg: '#FAFAFA', gray: '#8C8C8C', line: '#262626', acc: '#F99D1D', err: '#F08A7E' }
      : { bg: '#FAFAFA', fg: '#000000', gray: '#707070', line: '#E0E0E0', acc: '#D57C00', err: '#B3261E' };
    const data = [
      { name: '執筆中', posts: [
        { title: 'はじめての記事', slug: 'first-post', date: '2026-10-22', dirty: true },
        { title: '下書き', slug: 'draft-0001', date: '2026-10-15', dirty: true }
      ] },
      { name: '編集中', posts: [
        { title: '画像の入れ方', slug: 'how-to-images', date: '2026-10-18', dirty: true, conflict: true }
      ] },
      { name: '公開済み', posts: [
        { title: 'Astroのブログを始めた', slug: 'start-astro-blog', date: '2026-10-02' },
        { title: 'SMEAPを作った', slug: 'making-smeap', date: '2026-09-20' }
      ] }
    ];
    const all = data.flatMap((g) => g.posts);
    const cur = all.find((p) => p.slug === this.state.picked) ?? all[0];
    const groups = data.map((g) => ({
      name: g.name,
      count: g.posts.length,
      posts: g.posts.map((p) => ({
        ...p,
        dirty: !!p.dirty,
        conflict: !!p.conflict,
        mark: p.slug === cur.slug ? t.acc : 'transparent',
        pick: (e) => { e.preventDefault(); this.setState({ picked: p.slug }); }
      }))
    }));
    return {
      t, groups, cur, offline,
      fetchText: offline ? '読み込めませんでした。14:30の内容を表示しています' : 'niigo/blog · 14:30に読み込み',
      fetchColor: offline ? t.err : t.gray,
      canCommit: !!cur.dirty,
      cannotCommit: !cur.dirty
    };
  }
}
</script>
</body>
</html>
